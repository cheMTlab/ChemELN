[project]
name = "chemtlab"
version = "0.1.0.dev0"
description = "Open-source ELN and interactive chemical inventory"
readme = "../README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
    "django>=5.1,<6",
    "djangorestframework>=3.15",
    "drf-spectacular>=0.28",
    "django-environ>=0.11",
    "django-allauth[socialaccount,mfa]>=65.4",
    "psycopg[binary]>=3.2",
    "celery[redis]>=5.4",
    "gunicorn>=23",
    "whitenoise>=6.8",
    "rdkit>=2024.9",
    "django-simple-history>=3.7",
    "reportlab>=4.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-django>=4.9",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "chemtlab.settings"
python_files = ["test_*.py"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["S105", "S106"]
"conftest.py" = ["S106"]
