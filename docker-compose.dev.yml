# Development overrides:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
# Live-reloading Django on :8000 and Vite on :5173. Caddy and backups are disabled.
services:
  db:
    ports:
      - "5432:5432"

  backend:
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    environment:
      DJANGO_DEBUG: "true"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - media:/data/media

  worker:
    volumes:
      - ./backend:/app

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_PROXY: http://backend:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

  web:
    profiles: ["prod"]

  backup:
    profiles: ["prod"]

volumes:
  frontend_node_modules:
