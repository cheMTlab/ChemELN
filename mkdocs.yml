site_name: CheMTlab documentation
site_description: Open-source ELN and chemical inventory
repo_url: https://github.com/cheMTlab/ChemELN
theme:
  name: material
  features:
    - content.code.copy
nav:
  - Home: index.md
  - Installation: install.md
  - Lab notebook (ELN): eln.md
  - Reaction screening: screening.md
  - Biology, plates & assays: bio.md
  - Using the inventory: inventory.md
  - Reagent orders: orders.md
  - People & permissions: permissions.md
  - Data safety: data-safety.md
  - Roadmap:
      - "M4 Screening & optimization": roadmap/m4-optimization.md
markdown_extensions:
  - admonition
  - tables
  - pymdownx.superfences
